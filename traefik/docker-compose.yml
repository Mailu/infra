services:
  traefik:
    image: traefik:v3.7.13
    command: --configFile=/etc/traefik/traefik.toml
    restart: always
    # Docker's IPv6-to-IPv4 published-port proxy hides the real IPv6 client IP.
    # Host networking preserves it; the host can still reach web bridge IPs.
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/infra/traefik/traefik.toml:/etc/traefik/traefik.toml:ro
      - /opt/traefik/acme-v3.json:/acme-v3.json
    container_name: traefik

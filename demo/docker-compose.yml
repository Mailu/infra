services:

  front:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/nginx:${MAILU_VERSION:-master}
    restart: always
    env_file: .env
    logging:
      driver: journald
      options:
        tag: mailu-front
    volumes:
      - "/opt/certs:/certs"
      - "$ROOT/overrides/nginx:/overrides:ro"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # Keep HTTP-01 challenges on Mailu, including certificate renewals.
      - "traefik.http.routers.mailu-web.rule=Host(`test.mailu.io`) || PathPrefix(`/.well-known/acme-challenge/`)"
      - "traefik.http.routers.mailu-web.entrypoints=web"
      - "traefik.http.routers.mailu-web.service=mailu-web"
      - "traefik.http.routers.mailu-web.priority=100"
      - "traefik.http.services.mailu-web.loadbalancer.server.port=80"
      - "traefik.tcp.routers.mailu-websecure.rule=HostSNI(`test.mailu.io`)"
      - "traefik.tcp.routers.mailu-websecure.entrypoints=websecure"
      - "traefik.tcp.routers.mailu-websecure.tls.passthrough=true"
      - "traefik.tcp.routers.mailu-websecure.service=mailu-websecure"
      - "traefik.tcp.services.mailu-websecure.loadbalancer.server.port=443"
      - "traefik.tcp.services.mailu-websecure.loadbalancer.proxyProtocol.version=2"
      - "traefik.tcp.routers.mailu-smtp.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.mailu-smtp.entrypoints=smtp"
      - "traefik.tcp.routers.mailu-smtp.service=mailu-smtp"
      - "traefik.tcp.services.mailu-smtp.loadbalancer.server.port=25"
      - "traefik.tcp.services.mailu-smtp.loadbalancer.proxyProtocol.version=2"
      - "traefik.tcp.routers.mailu-pop3.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.mailu-pop3.entrypoints=pop3"
      - "traefik.tcp.routers.mailu-pop3.service=mailu-pop3"
      - "traefik.tcp.services.mailu-pop3.loadbalancer.server.port=110"
      - "traefik.tcp.services.mailu-pop3.loadbalancer.proxyProtocol.version=2"
      - "traefik.tcp.routers.mailu-imap.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.mailu-imap.entrypoints=imap"
      - "traefik.tcp.routers.mailu-imap.service=mailu-imap"
      - "traefik.tcp.services.mailu-imap.loadbalancer.server.port=143"
      - "traefik.tcp.services.mailu-imap.loadbalancer.proxyProtocol.version=2"
      - "traefik.tcp.routers.mailu-submissions.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.mailu-submissions.entrypoints=submissions"
      - "traefik.tcp.routers.mailu-submissions.service=mailu-submissions"
      - "traefik.tcp.services.mailu-submissions.loadbalancer.server.port=465"
      - "traefik.tcp.services.mailu-submissions.loadbalancer.proxyProtocol.version=2"
      - "traefik.tcp.routers.mailu-submission.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.mailu-submission.entrypoints=submission"
      - "traefik.tcp.routers.mailu-submission.service=mailu-submission"
      - "traefik.tcp.services.mailu-submission.loadbalancer.server.port=587"
      - "traefik.tcp.services.mailu-submission.loadbalancer.proxyProtocol.version=2"
      - "traefik.tcp.routers.mailu-imaps.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.mailu-imaps.entrypoints=imaps"
      - "traefik.tcp.routers.mailu-imaps.service=mailu-imaps"
      - "traefik.tcp.services.mailu-imaps.loadbalancer.server.port=993"
      - "traefik.tcp.services.mailu-imaps.loadbalancer.proxyProtocol.version=2"
      - "traefik.tcp.routers.mailu-pop3s.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.mailu-pop3s.entrypoints=pop3s"
      - "traefik.tcp.routers.mailu-pop3s.service=mailu-pop3s"
      - "traefik.tcp.services.mailu-pop3s.loadbalancer.server.port=995"
      - "traefik.tcp.services.mailu-pop3s.loadbalancer.proxyProtocol.version=2"
      - "traefik.tcp.routers.mailu-sieve.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.mailu-sieve.entrypoints=sieve"
      - "traefik.tcp.routers.mailu-sieve.service=mailu-sieve"
      - "traefik.tcp.services.mailu-sieve.loadbalancer.server.port=4190"
      - "traefik.tcp.services.mailu-sieve.loadbalancer.proxyProtocol.version=2"
    networks:
      - web
      - default
      - webmail
    mem_limit: 150m
    cpus: 0.2
    depends_on:
      - resolver
    dns:
      - $DNS

  resolver:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/unbound:${MAILU_VERSION:-master}
    env_file: .env
    restart: always
    networks:
      default:
        ipv4_address: $DNS
      web:
    mem_limit: 150m
    cpus: 0.2

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - "$ROOT/redis:/data"
    networks:
      - default
    depends_on:
      - resolver

  imap:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/dovecot:${MAILU_VERSION:-master}
    restart: always
    env_file: .env
    volumes:
      - "$ROOT/mail:/mail"
      - "$ROOT/overrides:/overrides:ro"
    logging:
      driver: journald
      options:
        tag: mailu-imap
    depends_on:
      - front
      - resolver
    dns:
      - $DNS
    networks:
      - default
      - fts_attachments
    blkio_config:
      weight: 100
    mem_limit: 250m
    cpus: 0.3

  smtp:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/postfix:${MAILU_VERSION:-master}
    restart: always
    env_file: .env
    logging:
      driver: journald
      options:
        tag: mailu-smtp
    volumes:
      - "$ROOT/overrides:/overrides"
    depends_on:
      - front
      - resolver
    networks:
      - default
    dns:
      - $DNS
    blkio_config:
      weight: 100
    mem_limit: 250m
    cpus: 0.2

  oletools:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/oletools:${MAILU_VERSION:-master}
    hostname: oletools
    restart: always
    env_file: .env
    logging:
      driver: journald
      options:
        tag: mailu-oletools
    networks:
      - noinet
    mem_limit: 500m
    cpus: 0.5

  fts_attachments:
    image: apache/tika:latest-full
    hostname: tika
    logging:
      driver: journald
      options:
        tag: mailu-tika
    restart: always
    networks:
      - fts_attachments
    depends_on:
      - resolver
    dns:
      - $DNS
    healthcheck:
      test: ["CMD-SHELL", "wget -nv -t1 -O /dev/null http://127.0.0.1:9998/tika || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 800m
    cpus: 0.2

  antispam:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/rspamd:${MAILU_VERSION:-master}
    restart: always
    env_file: .env
    volumes:
      - "$ROOT/filter:/var/lib/rspamd"
      - "$ROOT/dkim:/dkim"
      - "$ROOT/overrides/rspamd:/etc/rspamd/override.d"
    depends_on:
      - front
      - redis
      - oletools
      - antivirus
      - resolver
    networks:
      - default
      - web
      - noinet
    dns:
      - $DNS
    mem_limit: 400m
    cpus: 0.2

  antivirus:
    image: clamav/clamav-debian:stable
    restart: always
    env_file: .env
    logging:
      driver: journald
      options:
        tag: mailu-antispam
    volumes:
      - "$ROOT/filter:/data"
    networks:
      - default
      - web
    depends_on:
      - resolver
    dns:
      - $DNS
    blkio_config:
      weight: 100
    mem_limit: 2000m
    cpus: 0.75

  webdav:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/$WEBDAV:${MAILU_VERSION:-master}
    restart: always
    env_file: .env
    logging:
      driver: journald
      options:
        tag: mailu-webdav
    volumes:
      - "$ROOT/dav:/data"
    networks:
      - radicale
    blkio_config:
      weight: 100
    mem_limit: 100m
    cpus: 0.1

  admin:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/admin:${MAILU_VERSION:-master}
    restart: always
    env_file: .env
    logging:
      driver: journald
      options:
        tag: mailu-admin
    volumes:
      - "$ROOT/data:/data"
      - "$ROOT/dkim:/dkim"
    depends_on:
      - redis
      - resolver
    dns:
      - $DNS
    networks:
      - default
    mem_limit: 500m
    cpus: 0.5

  webmail:
    image: "${DOCKER_ORG:-ghcr.io/mailu}/webmail:${MAILU_VERSION:-master}"
    restart: always
    env_file: .env
    logging:
      driver: journald
      options:
        tag: mailu-webmail
    volumes:
      - "$ROOT/webmail:/data"
    networks:
      - webmail
    mem_limit: 500m
    cpus: 0.2

  fetchmail:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/fetchmail:${MAILU_VERSION:-master}
    restart: always
    env_file: .env
    logging:
      driver: journald
      options:
        tag: mailu-fetchmail
    networks:
      - default
      - web
    depends_on:
      - admin
      - smtp
      - imap
      - resolver
    dns:
      - $DNS
    mem_limit: 200m
    cpus: 0.2

networks:
  default:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: $SUBNET
  web:
    external: true
  radicale:
    driver: bridge
    internal: true
  webmail:
    driver: bridge
    internal: true
  noinet:
    driver: bridge
    internal: true
  fts_attachments:
    driver: bridge
    internal: true
